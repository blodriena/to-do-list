<!DOCTYPE html>
<html lang="en">
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do</title>
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main class="app">
        <section class="todo-card">
            <header class="todo-header">
                <p class="badge">Bugungi rejalar</p>
                <h1>Todo App</h1>
                <p class="subtitle">Vazifalaringizni tartibli va samarali boshqaring.</p>
            </header>
            <form class="todo-form" action="#">
                <input id="todo-input" type="text" placeholder="Yangi vazifa kiriting..." aria-label="Yangi vazifa">
                <button type="submit" class="todo-form-button">Qo'shish</button>
            </form>
            <div class="todo-actions">
                <button class="active" type="button">Barchasi</button>
                <button type="button">Faol</button>
                <button type="button">Bajarilgan</button>
            </div>
            <ul class="todo-list">
                
                
            </ul>
            <footer class="todo-footer">
                <span>2 ta vazifa qoldi</span>
                <button type="button">Bajarilganlarni tozalash</button>
            </footer>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
